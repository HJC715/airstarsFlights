<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#132847" />
    <meta
      name="description"
      content="星域航空 Air Stars 虛構航空訂票模擬網站。純前端體驗，無真實訂位與付款。"
    />
    <title>星域航空 Air Stars｜預訂機票</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/logo.svg" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/animations.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳至主要內容</a>
    <header>
      <div class="header-inner">
        <a href="#home" id="brand" class="brand" aria-label="星域航空 首頁"
          ><img
            src="./assets/icons/logo.svg"
            alt=""
            width="52"
            height="52"
          /><span>星域航空<small>AIR STARS</small></span></a
        >
        <nav aria-label="主要導覽">
          <button data-nav="home">首頁</button
          ><button data-nav="search">預訂機票</button>
        </nav>
        <label class="currency"
          ><span>顯示幣別</span
          ><select id="currency" aria-label="顯示幣別">
            <option>TWD</option>
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>JPY</option>
            <option>KRW</option>
            <option>HKD</option>
            <option>CNY</option>
          </select></label
        >
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <div class="brand-text">星域航空 <span>AIR STARS</span></div>
      <p>
        虛構航空公司・純前端訂票模擬。航班、票價、訂位及文件均無旅行效力，不會進行真實付款。
      </p>
      <small>© Air Stars 模擬專案 · 原創品牌與航空視覺 · ST 為虛構代碼</small>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
